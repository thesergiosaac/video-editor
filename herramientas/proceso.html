<!--
  Mi proceso (19-oct-2026; tablero 20-oct; «Tu camino para crecer» 26-oct)
  (26-oct) Sergio: «Mi proceso no es un paso a paso de lo que tenemos que hacer en la plataforma —para eso va un recorrido de
  bienvenida—: es el proceso de CRECIMIENTO, como en una mentoría: identidad de marca, nicho, ideas, referentes → publicar →
  mirar resultados → qué funcionó y qué falló → cambiar lo que falló, seguir lo que funcionó → hasta una fórmula que funcione
  para esa cuenta». Y «la pantalla negra debe ser más sutil, no tan gigante». Escogió MI propuesta de pasos
  (https://claude.ai/artifact/SS9KvBpPZ9ahjFpb6d5VFn) y aprobó la pantalla (https://claude.ai/artifact/8BptGwF6QMQkn2S6RVPc9B):
    · LA META, crecer, siempre arriba: tu nivel (CherryResumen.nivel, el mismo del inicio) y tus seguidores;
    · «Tu siguiente paso»: una franja con lo más urgente (lo que antes era la tarjeta negra gigante);
    · LA BASE (se hace una vez): 1 Define quién eres · 2 Estudia a tus referentes;
    · EL CICLO (cada semana): 3 Publica con constancia · 4 Descubre qué funcionó · 5 Afina tu fórmula → y vuelve al 3.
  Se fue el tablero de cada video (decidir, grabar, revisar, publicar, medir). La lógica que sabe en qué va cada video se
  queda: de ella sale «Tu siguiente paso» (medir un video, uno que no salió, uno a medias).
  No gasta IA: solo lee (laboratorio, calendario, estrategias, proceso, marca, mi_instagram, flujos_respuesta, historial) y
  guarda el documento «proceso» de la marca (lo que se marca a mano y los seguidores del día en que empezó).
  Estilo: el del Calendario en papel (Sergio: «las mejores pantallas, más minimalistas»).
-->
<style>

    --ficha: #FFFFFF;

    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--fondo); }
  body { margin: 0; }
  .app { min-height: 100vh; background: var(--fondo); color: var(--tinta); font-family: var(--f-texto); font-variant-numeric: tabular-nums;
    padding-inline: clamp(16px, 3vw, 40px); padding-block: 20px 48px; box-sizing: border-box; }
  @media (min-width: 1101px) { #app.ck-marco { padding-top: 16px; } }
  .app *, .app *::before, .app *::after { box-sizing: border-box; }
  .envoltura { max-width: 1320px; margin-inline: auto; display: grid; gap: var(--gap); }
  :focus-visible { outline: 2px solid var(--rosa); outline-offset: 3px; }
  :where(.app) :where(button) { font: inherit; color: inherit; }
  .ic { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: middle; }

  .vol { position: relative; isolation: isolate;
    background: radial-gradient(120% 90% at 78% 72%, var(--foco), transparent 60%), linear-gradient(180deg, var(--tarjeta-a), var(--tarjeta-b));
    border: 1px solid var(--borde); border-radius: var(--r);
    box-shadow: inset 0 1px 0 var(--brillo), 0 1px 0 rgba(0, 0, 0, .04), 0 26px 50px -26px var(--sombra), 0 60px 90px -60px var(--sombra); }
  .vol::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background-image: var(--grano); background-size: 180px;
    opacity: .05; mix-blend-mode: overlay; pointer-events: none; z-index: 3; }

  /* la barra (igual a la del Calendario) */
  .barra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-radius: 999px; padding: 10px 12px 10px 22px; }

  .logo img { display: block; height: 40px; width: auto; }
  .pastilla { font: 500 13px var(--f-texto); color: var(--tinta); background: var(--pastilla); border: 1px solid var(--borde); border-radius: 999px; padding: 9px 16px; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }

  .btn-sm { font-size: 12.5px; padding: 8px 13px; }

  /* ── la cabecera: título, la meta (crecer) y tu siguiente paso ── */
  .cab { padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 470px); gap: 18px 24px; align-items: center; }

  .meta-f { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  .niveles-n { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; font: 500 9.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }

    box-shadow: inset 0 1px 0 var(--brillo), 0 10px 24px -18px var(--sombra); }

  .sigue .txt em { font-style: normal; color: var(--tinta-2); }
  .sigue .acc { display: flex; align-items: center; gap: 4px; flex: none; }

  /* ── las dos partes: la base (2) y el ciclo (3, con la vuelta) ── */
  .partes { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3.1fr); gap: var(--gap); align-items: stretch; }
  .parte { padding: 16px; display: grid; grid-template-rows: auto 1fr; gap: 12px; min-width: 0; }
  .parte-cab { display: flex; align-items: baseline; gap: 10px; padding: 2px 4px 0; flex-wrap: wrap; }
  .parte-cab b { font: 800 18px var(--f-disp); letter-spacing: -.01em; }
  .parte-cab span { font-size: 12.5px; color: var(--tinta-2); }

  .ciclo .tjs { grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative; padding-bottom: 30px; }
  .tj { position: relative; background: var(--ficha); border: 1px solid var(--borde); border-radius: 22px; padding: 16px 15px 14px; display: flex; flex-direction: column; gap: 11px; min-width: 0;

  .formula { display: grid; gap: 5px; }

  .mas { text-align: center; font: 800 12px var(--f-disp); color: var(--tinta-3); line-height: .5; }

  .vuelta { position: absolute; left: 16%; right: 16%; bottom: 0; height: 22px; border: 2px dashed rgba(255, 45, 138, .45); border-top: 0; border-radius: 0 0 18px 18px; pointer-events: none; }
  .vuelta span { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); background: var(--tarjeta-b); padding: 0 10px; font: 600 11.5px var(--f-texto); color: var(--rosa-t); white-space: nowrap; }
  .cargando { padding: 70px 24px; text-align: center; color: var(--tinta-3); font-size: 14px; }

  /* el aviso de abajo (con «Deshacer») */
  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 14px;
    max-width: calc(100% - 32px); width: max-content; padding: 8px 8px 8px 20px; border-radius: 999px; background: var(--tinta); color: var(--fondo); font: 500 13.5px/1.35 var(--f-texto); box-shadow: 0 20px 40px -18px rgba(0, 0, 0, .7); }
  .toast::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rosa); flex: none; }
  .toast button { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--fondo); color: var(--tinta); cursor: pointer; font: 700 13px var(--f-texto); }
  .toast:not(:has(button)) { padding-right: 20px; }

  @media (max-width: 1100px) {
    .cab { grid-template-columns: minmax(0, 1fr); }
    .partes { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .barra { padding-left: 16px; }

  }

    if (X.e4.inerte) return { etapa: 4, txt: 'Tu siguiente paso: <b>cambia tu ' + X.e4.inerte.tipo.n.toLowerCase() + ' «' + esc(corto(X.e4.inerte.val, 40)) + '»</b> <em>· nunca te ha funcionado</em>', acc: '<a class="btn btn-claro btn-sm" href="proximo.html">Escoger otro ' + ic('flecha') + '</a>' };
    return { etapa: 5, txt: 'Tu siguiente paso: <b>graba tu próximo video con tu fórmula</b>', acc: '<a class="btn btn-claro btn-sm" href="proximo.html">Grabar con mi fórmula ' + ic('flecha') + '</a>' };
  }

  /* ═════════ PINTAR ═════════ */
  function tarj(n, titulo, est, cuerpo) {
    return '<div class="tj' + (est ? ' ' + est : '') + '">' + (est === 'ahora' ? '<span class="ahora-t">Ahora</span>' : '') +
      '<div class="tj-cab"><span class="n">' + (est === 'hecha' ? ic('check') : n) + '</span><h3>' + titulo + '</h3></div>' + cuerpo + '</div>';
  }
  var li = function (si, t, s) { return '<li class="' + (si ? 'si' : 'no') + '"><i>' + (si ? '✓' : '') + '</i><b>' + t + '</b>' + (s ? '<span>' + s + '</span>' : '') + '</li>'; };
  var img = function (src) { return '<img src="' + esc(src) + '" alt="" loading="lazy" onerror="this.remove()">'; };

  function pintar() {
    var mp = $('#mp');
    if (!D.lab) {
      if (!D.error) return;   // todavía cargando
      mp.setAttribute('aria-busy', 'false');
      mp.innerHTML = '<section class="vol cargando">No se pudo cargar tu camino: ' + esc(D.error) + ' <button type="button" class="btn btn-linea btn-sm" id="mp-otra">Intentar otra vez</button></section>';
      $('#mp-otra').onclick = function () { D.error = ''; cargarTodo(); };
      return;
    }
    E = calcular();
    var X = etapas(), sig = siguiente(X), ahora = sig.etapa;
    guardarInicio(X);
    var est = function (n, hecha) { return n === ahora ? 'ahora' : hecha ? 'hecha' : ''; };
    var nombre = E.nombre;

    // la meta
    var NIV = (window.CherryResumen && CherryResumen.NIVELES) || ['Aprendiz', 'Creador', 'Experto', 'Maestro', 'Leyenda'];
    var meta = '<div class="meta"><div class="meta-f"><span class="eti">La meta: crecer</span>' +
        (X.crece ? '<span><strong>' + (X.crece.n > 0 ? '+' : '') + miles(X.crece.n) + '</strong> seguidores ' + esc(X.crece.que) + '</span>' : '') + '</div>' +
      (X.nv ? '<div class="meta-f"><b>' + NIV[X.nv.i] + '</b><span>' + (X.nv.i < 4 ? Math.round(X.nv.avance * 100) + ' % hacia <strong>' + NIV[X.nv.i + 1] + '</strong>' : 'Lo más alto') + '</span></div>' +
        '<div class="niveles" role="img" aria-label="' + esc(NIV[X.nv.i] + (X.nv.i < 4 ? ', ' + Math.round(X.nv.avance * 100) + ' % hacia ' + NIV[X.nv.i + 1] : '')) + '">' + NIV.map(function (n, i) {
          return '<i class="' + (i < X.nv.i || X.nv.i === 4 ? 'si' : '') + '">' + (i === X.nv.i && X.nv.i < 4 ? '<u style="width:' + Math.max(4, Math.round(X.nv.avance * 100)) + '%"></u>' : '') + '</i>';
        }).join('') + '</div><div class="niveles-n">' + NIV.map(function (n, i) { return '<span' + (i === X.nv.i ? ' class="si"' : '') + '>' + n + '</span>'; }).join('') + '</div>'
        : '<div class="meta-f"><span>Tu nivel sale cuando Cherry vea tus videos con sus vistas.</span></div>') + '</div>';

    var h = '<section class="vol cab" aria-label="Tu camino para crecer"><div class="titulo"><span class="eti">Mi proceso · ' + esc(nombre) + '</span><h1>Tu camino <span>para crecer</span></h1></div>' + meta +
      '<div class="sigue"><span class="pt" aria-hidden="true"></span>' + (sig.tapa ? img(sig.tapa) : '') + '<span class="txt">' + sig.txt + '</span><span class="acc">' + sig.acc + '</span></div></section>';

    // la base
    var e1 = X.e1, e2 = X.e2, baseLista = e1.hecha && e2.hecha;
    var tipos2 = Object.keys(e2.porTipo).sort(function (a, b) { return e2.porTipo[b] - e2.porTipo[a]; }).slice(0, 3).map(function (k) { return e2.porTipo[k] + ' ' + (k === 'gancho' ? (e2.porTipo[k] === 1 ? 'gancho' : 'ganchos') : k === 'idea' ? (e2.porTipo[k] === 1 ? 'idea' : 'ideas') : k); });
    h += '<div class="partes"><section class="vol parte base" aria-label="La base"><div class="parte-cab"><b>La base</b><span>se hace una vez</span>' + (baseLista ? '<span class="lista-t">' + ic('check') + ' Lista</span>' : '') + '</div><div class="tjs">' +
      tarj(1, 'Define quién eres', est(1, e1.hecha), '<p class="que">A quién le hablas y cómo te reconocen.</p><ul class="lista">' +
        (e1.conMarca ? li(e1.identidad, 'Identidad de marca', e1.identidad ? 'colores, letras y tono' : 'todavía sin armar') : '') +
        li(e1.temas.length > 0, 'Tus temas', e1.temas.length ? esc(e1.temas.slice(0, 3).join(', ')) : 'escríbelos en tu estrategia') + '</ul>' +
        (!e1.conMarca ? '<a class="btn btn-linea btn-sm" href="estrategias.html" data-lado="estrategias">' + (e1.temas.length ? 'Ver mis temas' : 'Escribir mis temas') + '</a>'
          : e1.identidad && !e1.temas.length ? '<a class="btn btn-linea btn-sm" href="estrategias.html" data-lado="estrategias">Escribir mis temas</a>'
          : '<a class="btn btn-linea btn-sm" href="marca.html" data-lado="marca">' + (e1.identidad ? 'Ver mi marca' : 'Armar mi marca') + '</a>')) +
      tarj(2, 'Estudia a tus referentes', est(2, e2.hecha), '<p class="que">Lo que ya funciona en tu tema.</p>' +
        '<div class="gran"><strong>' + e2.n + '</strong><span>' + (e2.n === 1 ? 'pieza guardada' : 'piezas guardadas') + '<br>' + (tipos2.length ? esc(tipos2.join(' · ')) : 'de reels que desmontaste') + '</span></div>' +
        (e2.fotos.length ? '<div class="tapas">' + e2.fotos.map(img).join('') + '</div>' : '') +
        '<a class="btn btn-linea btn-sm" href="laboratorio.html?ir=v3">' + (e2.n ? 'Desmontar otro' : 'Desmontar un reel') + '</a>') +
      '</div></section>';

    // el ciclo
    var e3 = X.e3, e4 = X.e4, e5 = X.e5;
    var segs = '';
    if (e3.quiere) for (var i = 0; i < Math.min(e3.quiere, 14); i++) segs += '<i' + (i < e3.lleva ? ' class="si"' : '') + '></i>';
    h += '<section class="vol parte ciclo" aria-label="El ciclo"><div class="parte-cab"><b>El ciclo</b><span>cada semana</span></div><div class="tjs">' +
      tarj(3, 'Publica con constancia', est(3, false), '<p class="que">Cada video es una prueba.</p>' +
        (e3.quiere ? '<div class="gran"><strong>' + e3.lleva + '</strong><span>de ' + e3.quiere + ' esta semana<br>(tu estrategia)</span></div><div class="segs">' + segs + '</div>'
          : '<div class="gran"><strong>' + e3.lleva + '</strong><span>' + (e3.lleva === 1 ? 'video' : 'videos') + ' esta semana</span></div><p class="mini"><a href="estrategias.html" data-lado="estrategias" style="color:inherit;font-weight:700">Arma tu estrategia</a> para saber cuántos te conviene subir.</p>') +
        '<span class="mini">Últimas semanas: <b>' + e3.semanas.join(' · ') + '</b></span>' +
        '<a class="btn btn-linea btn-sm" href="calendario.html" data-cal>Programar</a>') +
      tarj(4, 'Descubre qué funcionó', est(4, false), '<p class="que">Lo que funcionó se queda; lo que falló se cambia.</p>' +
        (e4.medidos ? '<div class="mags"><div class="mag"><i style="background:#FF2D8A"></i>Magnéticas<b>' + e4.mag + '</b></div><div class="mag"><i style="background:#FFC93C"></i>Funcionaron a veces<b>' + e4.media + '</b></div>' +
            '<div class="mag"><i style="background:#6E6166"></i>Inertes<b>' + e4.inertes + '</b></div></div>' +
            (e4.inerte ? '<div class="pieza mal"><small>' + esc(e4.inerte.tipo.n) + ' inerte · cámbialo</small>' + esc(corto(cap(e4.inerte.val), 70)) + '</div>' : '') +
            '<span class="mini">Sale de tus <b>' + e4.medidos + '</b> reels medidos</span>'
          : '<p class="mini">Cuando Cherry mida tus primeros videos, aquí ves qué funcionó y qué falló.</p>') +
        '<a class="btn ' + (ahora === 4 ? 'btn-claro' : 'btn-linea') + ' btn-sm" href="laboratorio.html?ir=v4">Ver mis piezas</a>') +
      tarj(5, 'Afina tu fórmula', est(5, false), '<p class="que">Lo que funciona, junto en tu próximo video.</p><div class="formula">' +
        e5.formula.map(function (x, j) {
          return (j ? '<div class="mas" aria-hidden="true">+</div>' : '') + (x.falta ? '<div class="pieza falta"><small>' + x.tipo.n + '</small>Te falta ' + (x.tipo.k === 'idea' || x.tipo.k === 'estructura' ? 'una' : 'uno') + '</div>'
            : '<div class="pieza"><small>' + x.tipo.n + '</small>' + esc(corto(cap(x.frase ? x.val + ': «' + x.frase + '»' : x.val), 70)) + '</div>');
        }).join('') + '</div>' +
        '<a class="btn ' + (ahora === 5 ? 'btn-claro' : 'btn-linea') + ' btn-sm" href="proximo.html">Grabar con mi fórmula</a>') +
      '<span class="vuelta"><span>y vuelves a publicar con tu fórmula</span></span></div></section></div>';

    mp.innerHTML = h;
    mp.setAttribute('aria-busy', 'false');
  }

  /* El día en que empezó: los seguidores de la red escogida la primera vez que se ven (para «desde que empezaste») */
  function guardarInicio(X) {
    var p = proc(), red = (X.ig && X.ig.red) || 'ig';
    if (!X.seg || (p.inicio && p.inicio.red === red) || !App.guardar) return;
    p.inicio = { f: E.hoy, s: X.seg, red: red };
    guardarProc(p);
  }

  /* ═════════ MARCAR A MANO («Ya lo medí») ═════════ */
  function guardarProc(p) {
    // fuera lo de planes que ya no existen (el documento se queda chiquito)
    var ids = {}; arr(D.lab && D.lab.planes).forEach(function (x) { if (x && x.id) ids[x.id] = 1; });
    arr(D.cal && D.cal.posts).forEach(function (x) { if (x && x.id) ids['cal:' + x.id] = 1; });
    arr(D.hist).forEach(function (h) { if (h && h.igMediaId) ids['ig:' + h.igMediaId] = 1; });
    Object.keys(p.videos).forEach(function (k) { if (!ids[k]) delete p.videos[k]; });
    D.proc = p;
    App.guardar('proceso', p, function (estado, msg) { if (estado === 'error') aviso('No se pudo guardar: ' + (msg || 'revisa tu conexión') + '.', 6000); });
  }
  function medido() {
    var t = E && E.rec; if (!t || !t.id) return;
    var antes = JSON.stringify(proc()), p = proc();
    (p.videos[t.id] = p.videos[t.id] || {})[7] = { f: E.hoy, v: 'hecho' };
    guardarProc(p);
    pintar();
    aviso('Listo: «' + corto(tituloT(t), 40) + '» ya está medido.', 0, function () { D.proc = JSON.parse(antes); guardarProc(proc()); pintar(); aviso('Listo, quedó como estaba.'); });
  }
  $('#app').addEventListener('click', function (e) {
    if (e.target.closest('[data-medido]')) { medido(); return; }
    if (e.target.closest('[data-conectar]')) { if (window.CherryCuenta && CherryCuenta.conectar) CherryCuenta.conectar(); return; }
    /* (8-oct) el Calendario, cerrado por ahora para quien no es administrador: la puerta la tiene cuenta.js */
    var a = e.target.closest('a[data-cal]');
    if (a && window.CherryCuenta && CherryCuenta.puertaCalendario) {
      e.preventDefault();
      CherryCuenta.puertaCalendario(function () { location.href = a.href; });
    }
  });

  /* ═════════ CARGAR ═════════
     Primero lo que hay guardado en este navegador (pinta al instante); después lo de la cuenta. Cada lectura falla sola:
     sin Calendario o sin estrategia la pantalla igual sirve. Solo el Laboratorio es imprescindible. */
  function local(h) { try { return App.copiaLocal(h); } catch (e) { return null; } }
  function cargarTodo() {
    var copia = function (h) { return function () { return local(h); }; };
    var nada = function () { return null; };
    /* (20-oct) la lista del historial (la misma que pide el Laboratorio en pedirHistorial): todos los reels de las cuentas
       conectadas con sus números. Solo LEE (accion «lista»: sin IA, sin créditos); no frena la primera pintada y, si falla, el
       camino sigue como antes. */
    App.funcion('historial', { accion: 'lista' }).then(function (r) {
      D.hist = (r && Array.isArray(r.videos)) ? r.videos : null;
      if (D.lab && D.listo) pintar();
    }, function () { /* sin historial: lo de siempre */ });
    return Promise.all([
      App.cargar('laboratorio'),
      App.cargar('calendario').catch(copia('calendario')),
      App.cargar('estrategias').catch(copia('estrategias')),
      App.cargar('proceso').catch(copia('proceso')),
      App.rest('/rest/v1/mi_instagram?select=ig_user_id,usuario,marca,estado').catch(nada),
      // (20-oct) con a qué publicación va cada una; si esas columnas no están, lo básico
      App.rest('/rest/v1/flujos_respuesta?select=id,activa,marca,ig_user_id,donde,media_id,proyecto_id').catch(function () {
        return App.rest('/rest/v1/flujos_respuesta?select=id,activa,marca,ig_user_id').catch(nada);
      }),
      App.cargar('marca').catch(copia('marca')),   // (26-oct) la identidad de marca: el paso 1
    ]).then(function (x) {
      D.lab = x[0] || D.lab || { cuentas: [], planes: [], videos: [], fichas: [], formulas: [] };
      D.cal = x[1]; D.est = x[2]; D.proc = x[3]; D.ig = x[4]; D.flujos = x[5]; D.marca = x[6] || D.marca;
      D.listo = true; D.error = '';
      pintar();
      cargarMedidas();
    }).catch(function (e) {
      D.error = (e && e.message) || 'Algo falló.';
      if (!D.lab) D.lab = local('laboratorio');
      pintar();
    });
  }

  /* (20-oct) lo que el servidor sabe de los videos que Cherry publicó en Instagram desde el Calendario: si salieron o
     fallaron, su ig_media_id y, con él, sus números (vista mis_publicaciones, la última medición de cada reel). Solo
     lectura y con las reglas de la base (cada quien ve lo suyo); si falla, el tablero sigue con lo del Calendario. */
  function cargarMedidas() {
    var hace30 = sumarDias(fechaLocal(new Date()), -30);
    var ids = arr(D.cal && D.cal.posts).filter(function (x) { return x && x.tipo === 'video' && x.igProgramada && f10(x.fecha) >= hace30; })
      .map(function (x) { return String(x.igProgramada); }).filter(function (id) { return /^[0-9a-f-]{36}$/i.test(id); });
    if (!ids.length) return;
    App.rest('/rest/v1/publicaciones_programadas?select=id,estado,ig_media_id,error&id=in.(' + ids.join(',') + ')').then(function (filas) {
      var prog = {}; arr(filas).forEach(function (f) { if (f && f.id) prog[f.id] = f; });
      D.prog = prog;
      var medias = Object.keys(prog).map(function (k) { return prog[k].ig_media_id; }).filter(Boolean);
      if (!medias.length) return null;
      return App.rest('/rest/v1/mis_publicaciones?select=ig_media_id,retencion,vistas,horas,medido&ig_media_id=in.(' + medias.map(encodeURIComponent).join(',') + ')')
        .then(function (fs) { var m = {}; arr(fs).forEach(function (f) { if (f && f.ig_media_id) m[f.ig_media_id] = f; }); D.pubs = m; }, function () { return null; });
    }).then(function () { if (D.lab) pintar(); }, function () { /* sin eso, lo del Calendario */ });
  }

  /* (26-oct) los seguidores de los últimos 28 días (para la meta, mientras no pasen 28 días desde que empezó) */
  function cargarCuenta() {
    var q = window.CherryCuenta, ig = null;
    try { ig = q && q.instagram ? q.instagram() : null; } catch (e) { ig = null; }
    if (!ig || !ig.perfil || D.cuenta || !q.llamar) return;
    var r = ig.red || 'ig';
    var pide = r === 'yt' ? (ig.perfil.canal_id ? q.llamar('yt-conectar', { accion: 'cuenta', canal_id: ig.perfil.canal_id }) : null)
      : r === 'ig' ? q.llamar('ig-metricas', { modo: 'cuenta', marca: ig.marca }) : null;
    if (!pide) return;
    D.cuenta = {};
    pide.then(function (c) { D.cuenta = c && !c.error ? c : {}; if (D.lab) pintar(); }, function () { D.cuenta = {}; });
  }

  /* ═════════ ARRANQUE ═════════ */
  if (!App) { D.error = 'Cherry no cargó. Recarga la página.'; pintar(); return; }
  App.barra();
  D.lab = local('laboratorio'); D.cal = local('calendario'); D.est = local('estrategias'); D.proc = local('proceso'); D.marca = local('marca');
  if (D.lab) pintar();
  cargarTodo();
  // cuando llega lo de Instagram (perfil y números de los videos), se repinta: puede cambiar la meta y el paso de medir
  if (window.CherryCuenta && CherryCuenta.cuandoLlegueInstagram) CherryCuenta.cuandoLlegueInstagram(function () { cargarCuenta(); if (D.lab) pintar(); });
  // al volver con «atrás» desde una herramienta, lo de allá pudo cambiar
  window.addEventListener('pageshow', function (e) { if (e.persisted) cargarTodo(); });
})();
</script>
</body>

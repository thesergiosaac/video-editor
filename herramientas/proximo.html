<!--
  Tu próximo video (20-oct-2026)
  Reemplaza el trabajo de «Lo siguiente» del Laboratorio (la carta «Qué grabar después» del inicio y el paso 3 de Mi proceso
  llegan aquí). Sergio aprobó el prototipo B (scratchpad propuestas/estilos/simple_plantilla.html, artefacto
  SHKNA2n6bsvE1diq9D4uE3): TRES preguntas, una a la vez —el estilo, la idea y el gancho de tu video— y al final las tres
  piezas, una frase de por qué y «Escribir el guion». Sus reglas: muy mínimo y claro para quien entra la primera vez; cada
  paso dice QUÉ se escoge y qué es con palabras de todos los días; cada opción es un video SUYO (portada, nombre y vistas),
  nunca un nombre abstracto solo; una barrita de color bajo las vistas (contra la mejor de ese paso) y una estrella dorada
  con «El/La que mejor te funciona» en la mejor; SIEMPRE claro (en oscuro las tarjetas se veían «muy planas, muy negras»).
  Datos: solo lee (gratis) la lista del historial (función historial › lista: cada reel con sus piezas: estilo, tema y
  ángulo, gancho y su frase), el Laboratorio, el Calendario y publicaciones_programadas (para el nombre de cada video).
  «Escribir el guion» deja la receta en sessionStorage['cherry-receta'] y abre Guiones (lab-guiones.js la pone en el guion
  premium).
-->

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var App = window.CherryApp;
  var VACIA = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';   // si la portada no carga, queda el fondo oscuro

  /* (20-oct) cada paso dice QUÉ se escoge (estilo, idea, gancho) y qué es, con palabras de todos los días */
  var PARTES = [
    { k: 'se_ve', c: 'estilo', palabra: 'Estilo', de: 'cómo se ve', pregunta: 'Escoge el estilo de tu video', uno: 'el único estilo',
      explica: 'El estilo es cómo se ve tu video: la animación, los colores, el lugar. Estos son los estilos que más te han funcionado.' },
    { k: 'habla', c: 'idea', palabra: 'Idea', de: 'de qué habla', pregunta: 'Escoge la idea de tu video', uno: 'la única idea',
      explica: 'La idea es el tema del que va a hablar tu video. Estas son las ideas que más te han funcionado.' },
    { k: 'arranca', c: 'gancho', palabra: 'Gancho', de: 'cómo arranca', pregunta: 'Escoge el gancho de tu video', uno: 'el único gancho',
      explica: 'El gancho es cómo arranca: la primera frase, la que hace que la gente no pase de largo. Estos son los ganchos que más te han funcionado.' },
  ];
  // los tipos de gancho del historial, dichos como los diría cualquiera
  var GANCHO_SIMPLE = { 'Historia': 'Contar una escena', 'Misterio': 'Anunciar algo sin decir qué es', 'Contradicción': 'Decir lo contrario de lo que se cree',
    'Promesa': 'Prometer algo', 'Pregunta': 'Hacer una pregunta', 'Dato': 'Dar un dato', 'Orden': 'Dar una orden', 'Confesión': 'Confesar algo', 'Error común': 'Señalar un error' };
  var ESTRELLA = '<svg class="estrella" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8l2.5 5.2 5.7.8-4.1 4 1 5.6L10 14.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z"/></svg>';

  var D = null;                 // { se_ve: [...], habla: [...], arranca: [...] }
  var paso = 0, resp = {};      // el paso de las tres preguntas y lo escogido (índices)
  var datos = { lab: null, cal: null, hist: null, ig: null, prog: null };

  function arr(x) { return Array.isArray(x) ? x : []; }
  function mil(n) { return Number(n).toLocaleString('es-CO'); }
  function corto(t, n) { t = String(t || '').trim(); return t.length > n ? t.slice(0, n - 1).trim() + '…' : t; }
  function cap(t) { t = String(t || '').trim(); return t ? t.charAt(0).toUpperCase() + t.slice(1) : ''; }
  var tAviso = 0;
  function aviso(t) { var a = $('#aviso'); a.textContent = t; a.hidden = false; clearTimeout(tAviso); tAviso = setTimeout(function () { a.hidden = true; }, 3600); }

  /* ── El nombre de cada video ──
     El historial solo tiene el comienzo del texto de la publicación. Primero el título del post del Calendario que lo publicó
     (sin la nota entre paréntesis del final: «La mesa olvidada (Increíbles v2)» → «La mesa olvidada»), después el título del
     plan del Laboratorio atado a ese reel, y si no, la primera frase del texto, corta. */
  var NOMBRES = {};
  function armarNombres() {
    NOMBRES = {};
    arr(datos.lab && datos.lab.planes).forEach(function (p) {
      var t = String((p && p.titulo) || '').trim();
      if (t && p.video && /^\d{6,}$/.test(String(p.video))) NOMBRES[p.video] = NOMBRES[p.video] || t;
    });
    arr(datos.cal && datos.cal.posts).forEach(function (x) {
      var s = x && x.igProgramada && datos.prog ? datos.prog[x.igProgramada] : null, media = (s && s.ig_media_id) || (x && x.igMediaId);
      var t = String((x && x.titulo) || '').trim();
      if (media && t) NOMBRES[media] = t;   // el del Calendario manda
    });
  }
  // la primera frase del texto de la publicación: sin emojis ni símbolos al principio y, si viene en MAYÚSCULA sostenida, en frase normal
  function primeraFrase(v) {
    var txt = String(v.texto || v.titulo || '').replace(/\s+/g, ' ').replace(/^[^\p{L}\p{N}¿¡«"]+/u, '').trim(), m = /^(.+?[.!?])(\s|$)/.exec(txt);
    var f = (m ? m[1] : txt).replace(/\.$/, '');
    var letras = f.slice(0, 34).replace(/[^\p{L}]/gu, ''), mayus = letras.replace(/[^\p{Lu}]/gu, '');   // lo que se ve del nombre
    if (letras.length > 6 && mayus.length / letras.length > 0.7) f = cap(f.toLowerCase());
    return corto(f, 34) || 'Video sin texto';
  }
  // los nombres posibles, del más corto al más largo: así dos opciones de la misma pregunta no se llaman igual
  function nombresDe(v) {
    var t = NOMBRES[v.igMediaId], l = [];
    if (t) { l.push(corto(t.replace(/\s*\([^)]*\)\s*$/, ''), 34)); l.push(corto(t, 34)); }
    l.push(primeraFrase(v));
    return l.filter(function (x, i) { return x && l.indexOf(x) === i; });
  }
  function nombreDe(v) { return nombresDe(v)[0]; }
  function sinRepetir(ops) {
    ops.forEach(function (o, i) {
      var q = 0;
      while (q < o.nombres.length - 1 && ops.some(function (x, j) { return j < i && x.video === o.video; })) o.video = o.nombres[++q];
    });
    return ops;
  }

  /* ── Las opciones de cada pregunta (como armar_simple.py del prototipo) ──
     Cada opción es su MEJOR video (el de más vistas) y se ordenan por eso. El estilo y la idea muestran 4; el gancho, 3, y
     solo los que tienen su frase escrita (se toma el mejor video de ese gancho que la tenga). */
  function armar() {
    var deMarca = arr(datos.ig).filter(function (c) { return c && c.marca && App.esDeMarca(c.marca); });
    var lab = datos.lab || {}, ig = deMarca.filter(function (c) { return c.estado === 'activa'; })[0] || deMarca[0] || null;
    var vids = arr(datos.hist).filter(function (v) {
      var pz = v && v.historial && v.historial.piezas;
      if (!pz || !pz.estilo || !(Number(v.visitas) > 0)) return false;
      return v.cuenta ? App.esDeMarca(v.cuenta) : !!ig && v.igUserId === ig.ig_user_id;
    }).map(function (v) { return { v: v, pz: v.historial.piezas, vistas: Number(v.visitas) }; });
    var cuenta = arr(lab.cuentas).filter(function (c) { return c && c.id === App.marcaActual(); })[0] || {};
    $('#px-marca').textContent = (ig && ig.usuario ? '@' + ig.usuario : cuenta.nombre || 'Tu marca') + ' · tu próximo video';
    if (vids.length < 3) return null;
    armarNombres();
    function opciones(clave, conFrase) {
      var g = {};
      vids.forEach(function (x) { var k = x.pz[clave]; if (!k || (conFrase && !String(x.pz.gancho_frase || '').trim())) return; (g[k] = g[k] || []).push(x); });
      return Object.keys(g).map(function (k) {
        var mejor = g[k].reduce(function (a, b) { return b.vistas > a.vistas ? b : a; });
        return { k: k, id: mejor.v.igMediaId, video: nombreDe(mejor.v), nombres: nombresDe(mejor.v), vistas: mejor.vistas, img: mejor.v.tapa || '', n: g[k].length, estilo: mejor.pz.estilo,
          tema: cap(mejor.pz.angulo || k), gancho: GANCHO_SIMPLE[k] || k, frase: String(mejor.pz.gancho_frase || '').trim() };
      }).sort(function (a, b) { return b.vistas - a.vistas; });
    }
    var r = { se_ve: sinRepetir(opciones('estilo').slice(0, 4)), habla: sinRepetir(opciones('tema').slice(0, 4)), arranca: sinRepetir(opciones('gancho', true).slice(0, 3)) };
    return r.se_ve.length && r.habla.length && r.arranca.length ? r : null;
  }

  /* lo que se lee de cada opción, sin palabras técnicas */
  function texto(parte, o) {
    if (parte === 'se_ve') return '<span class="que">Como «' + esc(o.video) + '»</span>';
    if (parte === 'habla') return '<span class="que">' + esc(o.tema) + '</span>';
    return '<span class="que">' + esc(o.gancho) + '</span><span class="frase" title="' + esc(o.frase) + '">«' + esc(o.frase) + '»</span>';
  }
  /* las vistas con una barrita de color (contra la mejor de ese paso) y la estrella en la que más ha funcionado; en el estilo
     el nombre del video ya está en el título, no se repite */
  function vistas(o, parte) {
    var max = Math.max.apply(null, D[parte].map(function (x) { return x.vistas; })), mejor = o.vistas === max;
    return '<span class="medida' + (mejor ? ' mejor-v' : '') + '"><span class="barra-v" aria-hidden="true"><i style="width:' + Math.max(4, Math.round(o.vistas / max * 100)) + '%"></i></span>' +
      '<span class="num">' + (mejor ? ESTRELLA : '') + '<b>' + mil(o.vistas) + '</b> vistas' + (parte === 'se_ve' ? '' : ' · «' + esc(o.video) + '»') + '</span></span>';
  }
  function chip(p) { return '<span class="chip ' + p.c + '">' + p.palabra + ' <small>· ' + p.de + '</small></span>'; }
  function portada(o) { return '<img src="' + esc(o.img || VACIA) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=\'' + VACIA + '\'">'; }
  function porque(e) {
    var s = D.se_ve[e.se_ve], i = D.habla[e.habla];
    if (i.estilo === s.k) return 'Ya hiciste esta idea con este estilo en «' + esc(i.video) + '»: <b>' + mil(i.vistas) + ' vistas</b>. Hazla con una historia nueva.';
    if (s.vistas > i.vistas) return 'Tu idea de «' + esc(i.video) + '» sacó ' + mil(i.vistas) + ' vistas con otro estilo. <b>Con el estilo de «' + esc(s.video) + '» puede llegar mucho más lejos.</b>';
    return 'Es una prueba: nunca has hecho esta idea con este estilo.';
  }

  /* ═════════ PINTAR: las tres preguntas, una a la vez, y el resultado ═════════ */
  function pintar() {
    var v = $('#vista');
    $('#px').setAttribute('aria-busy', 'false');
    var barra = '<div class="avance-p" aria-hidden="true">' + PARTES.map(function (_, i) { return '<i' + (i <= paso ? ' class="si"' : '') + '></i>'; }).join('') + '</div>';
    if (paso < 3) {
      var p = PARTES[paso], ops = D[p.k];
      v.innerHTML = '<div class="paso">' + barra + '<span class="etq">Paso ' + (paso + 1) + ' de 3</span><h2>' + p.pregunta + '</h2>' +
        '<p class="sub">' + p.explica + (ops.length === 1 ? ' Por ahora es ' + p.uno + ' que tienes.' : '') + '</p>' +
        '<div class="ops">' + ops.map(function (o, i) {
          return '<button type="button" class="op' + (i === 0 ? ' top' : '') + '" data-escoger="' + i + '" aria-label="' + esc((p.k === 'se_ve' ? 'Como ' + o.video : p.k === 'habla' ? o.tema : o.gancho + ': ' + o.frase) + ' · ' + mil(o.vistas) + ' vistas') + '">' +
            (i === 0 ? '<span class="mejor">' + ESTRELLA + (p.c === 'idea' ? 'La' : 'El') + ' que mejor te funciona</span>' : '') + portada(o) + texto(p.k, o) + vistas(o, p.k) + '</button>';
        }).join('') + '</div>' +
        (paso ? '<div class="nav"><button type="button" class="b-linea" data-atras>← Atrás</button></div>' : '') + '</div>';
    } else {
      v.innerHTML = '<div class="paso">' + barra + '<span class="etq">Listo</span><h2>Tu próximo video</h2>' +
        '<div class="tres">' + PARTES.map(function (p) {
          var o = D[p.k][resp[p.k]];
          return '<section class="pieza" aria-label="' + p.palabra + '">' + chip(p) + portada(o) + texto(p.k, o) + vistas(o, p.k) + '</section>';
        }).join('') + '</div>' +
        '<div class="porque"><p>' + porque(resp) + '</p><div class="nav"><button type="button" class="b-principal" data-escribir>✦ Escribir el guion <span class="costo">10 créditos</span></button>' +
        '<button type="button" class="b-linea" data-reiniciar>Empezar otra vez</button></div></div></div>';
    }
  }
  function pintarVacio(titulo, texto, boton) {
    $('#px').setAttribute('aria-busy', 'false');
    $('#vista').innerHTML = '<div class="vacio"><h2>' + esc(titulo) + '</h2><p class="sub">' + esc(texto) + '</p>' + boton + '</div>';
  }

  document.getElementById('app').addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t || !D) return;
    if (t.hasAttribute('data-escoger')) { resp[PARTES[paso].k] = Number(t.getAttribute('data-escoger')); paso++; pintar(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-atras')) { paso = Math.max(0, paso - 1); pintar(); return; }
    if (t.hasAttribute('data-reiniciar')) { paso = 0; resp = {}; pintar(); return; }
    if (t.hasAttribute('data-escribir')) {
      /* la receta para el guion premium de Guiones (lab-guiones.js la lee una vez y Cherry lo escribe de una, sin preguntar) */
      var s = D.se_ve[resp.se_ve], i = D.habla[resp.habla], a = D.arranca[resp.arranca];
      try {
        sessionStorage.setItem('cherry-receta', JSON.stringify({ estilo: s.k, video: s.video, idea: i.k, angulo: i.tema, gancho: a.gancho, frase: a.frase, ejemplos: [s.id, i.id, a.id] }));
      } catch (er) { /* sin sessionStorage: Guiones abre igual, sin la receta escrita */ }
      location.href = 'laboratorio.html?modo=guiones&nuevo=1';
    }
  });

  /* ═════════ CARGAR (solo lee; nada cuesta) ═════════ */
  function cargar() {
    var nada = function () { return null; };
    return Promise.all([
      App.cargar('laboratorio').catch(function () { return App.copiaLocal('laboratorio'); }),
      App.cargar('calendario').catch(function () { return App.copiaLocal('calendario'); }),
      App.funcion('historial', { accion: 'lista' }),
      App.rest('/rest/v1/mi_instagram?select=ig_user_id,usuario,marca,estado').catch(nada),
    ]).then(function (x) {
      datos.lab = x[0]; datos.cal = x[1]; datos.hist = (x[2] && x[2].videos) || []; datos.ig = x[3];
      // el ig_media_id de lo que Cherry publicó desde el Calendario (para el nombre de cada video)
      var ids = arr(datos.cal && datos.cal.posts).filter(function (p) { return p && p.tipo === 'video' && p.igProgramada; })
        .slice(-150).map(function (p) { return String(p.igProgramada); }).filter(function (id) { return /^[0-9a-f-]{36}$/i.test(id); });
      if (!ids.length) return null;
      return App.rest('/rest/v1/publicaciones_programadas?select=id,ig_media_id&id=in.(' + ids.join(',') + ')').then(function (fs) {
        var m = {}; arr(fs).forEach(function (f) { if (f && f.id) m[f.id] = f; }); datos.prog = m;
      }, nada);
    }).then(function () {
      D = armar();
      if (!D) {
        pintarVacio('Todavía no tengo suficientes videos tuyos', 'Todavía no tengo suficientes videos tuyos para recomendarte tu próximo video. Cuando Cherry mida y desmonte por lo menos 3 de tus reels, aquí te muestro qué te funciona.',
          '<a class="b-principal" href="laboratorio.html?ir=v5">Ver mis videos</a>');
        return;
      }
      paso = 0; resp = {}; pintar();
    }).catch(function () {
      pintarVacio('No pude traer tus videos', 'Revisa tu conexión y vuelve a intentarlo.', '<button type="button" class="b-linea" id="px-otra">Intentar otra vez</button>');
      $('#px-otra').onclick = function () { $('#vista').innerHTML = '<p class="sub">Buscando tus videos…</p>'; cargar(); };
    });
  }

  if (!App) { pintarVacio('No se pudo cargar', 'Recarga la página.', ''); return; }
  App.barra();
  cargar();
})();
</script>
</body>

  /* ════════ La Consola (29-oct-2026) ════════ */

  .cn-det { padding: 22px; }

  .cn-d-izq, .cn-d-der { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .cn-tec summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--tinta2); }
  .cn-tec pre { margin: 8px 0 0; padding: 12px; border-radius: 14px; background: #141414; color: #EDEDEA; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; }
  .cn-estados { display: flex; flex-wrap: wrap; gap: 6px; }

  .cn-d-der textarea { width: 100%; min-height: 68px; resize: vertical; border: 1.5px solid var(--linea); border-radius: 16px; padding: 11px 13px; background: var(--tarjeta); font-size: 15px; line-height: 1.4; }
  .cn-d-der textarea:focus { outline: none; border-color: var(--tinta); }
  .cn-ya { font-size: 13.5px; color: var(--tinta2); padding: 10px 12px; border-left: 3px solid var(--fucsia); background: var(--suave); border-radius: 0 12px 12px 0; white-space: pre-wrap; }
  .cn-volver { display: none; }
  @media (max-width: 1180px) { .cn-d { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 900px) {
    .cn-cuerpo { grid-template-columns: minmax(0, 1fr); }

  }

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var App = window.CherryApp;
  var SUPA = 'https://xsptcepijtnmowqauyxw.supabase.co';
  var ABIERTOS = ['recibido', 'arreglando'];
  /* los estados: los mismos que ve la persona en «Mis reportes» (js/reportes.js › ESTADOS) */
  var ESTADOS = {
    error: [['recibido', 'Recibido'], ['arreglando', 'Lo estamos arreglando'], ['arreglado', 'Arreglado'], ['no', 'Por ahora no']],
    idea: [['recibido', 'Recibido'], ['planes', 'En planes'], ['arreglado', 'Ya está'], ['no', 'Por ahora no']],
  };
  /* respuestas de un toque: llenan la caja (se puede cambiar antes de guardar) y escogen el estado */
  var RAPIDAS = {
    error: [['arreglando', 'Gracias por avisar. Ya lo estamos mirando y te escribimos aquí cuando quede.'],
      ['arreglado', 'Ya quedó arreglado. Prueba otra vez y nos cuentas.']],
    idea: [['planes', '¡Gracias por la idea! La pusimos en los planes.'],
      ['no', 'Gracias por la idea. Por ahora no está en los planes, pero la dejamos anotada.']],
  };
  var FILTROS = [['atender', 'Por atender'], ['urgentes', 'Urgentes'], ['errores', 'Errores'], ['ideas', 'Ideas'], ['todos', 'Todos']];
  var E = { filas: null, filtro: 'atender', abierto: null, borrador: {}, fotos: {} };

  var tAviso = 0;
  function aviso(t) { var a = $('#aviso'); a.textContent = t; a.hidden = false; clearTimeout(tAviso); tAviso = setTimeout(function () { a.hidden = true; }, 4200); }
  function nombreEstado(f) { var x = (ESTADOS[f.tipo] || ESTADOS.error).filter(function (e) { return e[0] === f.estado; })[0]; return x ? x[1] : f.estado; }
  function hace(iso) {
    var d = (Date.now() - new Date(iso).getTime()) / 60000;
    if (d < 2) return 'hace un momento'; if (d < 60) return 'hace ' + Math.round(d) + ' min'; if (d < 1440) return 'hace ' + Math.round(d / 60) + ' h';
    if (d < 2880) return 'ayer';
    return new Date(iso).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
  }
  function fecha(iso) { return new Date(iso).toLocaleString('es-CO', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  // la promesa de las 24 horas: lo que sigue sin respuesta
  function tarde(f) { return !f.respondido && ABIERTOS.indexOf(f.estado) >= 0 && Date.now() - new Date(f.creado).getTime() > 24 * 3600000; }
  function equipo(t) {
    var ua = (t && t.navegador) || '';
    var nav = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Navegador';
    var so = /iPhone|iPad/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '';
    return nav + (so ? ' · ' + so : '') + (t && t.pantalla ? ' · ' + t.pantalla : '');
  }
  function quien(f) { return f.correo || 'sin correo'; }

  /* ════════ Traer ════════ */
  function cargar() {
    var u = App.usuario();
    // solo el administrador: lo dice la tabla `administradores` (la misma que mira el inicio)
    return App.rest('/rest/v1/administradores?user_id=eq.' + u.id + '&select=user_id').then(function (a) {
      if (!Array.isArray(a) || !a.length) { noEsAdmin(); return; }
      try { localStorage.setItem('cherry-admin-' + u.id, '1'); } catch (e) { /* nada */ }
      return App.rest('/rest/v1/reportes?select=*&order=creado.desc&limit=400').then(function (fs) {
        E.filas = Array.isArray(fs) ? fs : [];
        var q = Number(new URLSearchParams(location.search).get('r'));
        if (q && E.filas.some(function (f) { return f.id === q; })) { E.filtro = 'todos'; abrir(q); }
        pintar();
      });
    }).catch(function (e) {
      $('#px').setAttribute('aria-busy', 'false');
      var falta = /reportes/.test(e.message) && /404|does not exist|42P01|schema cache/.test(e.message);
      $('#vista').innerHTML = '<div class="tarjeta vacio"><h3>' + (falta ? 'Falta crear la tabla de reportes' : 'No pude traer los reportes') + '</h3><p class="sub">' +
        (falta ? 'Corre la migración servidor/sql/28-reportes.sql y recarga la página.' : 'Revisa tu conexión y vuelve a intentarlo.') + '</p>' +
        '<button type="button" class="b-linea" data-otra>Intentar otra vez</button></div>';
      $('[data-otra]').onclick = function () { cargar(); };
    });
  }
  function noEsAdmin() {
    $('#px').setAttribute('aria-busy', 'false');
    $('#cn-filtros').hidden = true;
    $('#vista').innerHTML = '<div class="tarjeta vacio"><h3>Esta página es solo para el administrador</h3>' +
      '<p class="sub">Si encontraste un error o tienes una idea, cuéntanos desde «Reportar o sugerir».</p>' +
      '<div class="nav"><button type="button" class="b-principal" data-reportar>Reportar o sugerir</button><a class="b-linea" href="../app">Volver al inicio</a></div></div>';
  }

  /* ════════ Pintar ════════ */
  function cuenta(k) {
    var fs = E.filas || [];
    return fs.filter(function (f) {
      if (k === 'atender') return ABIERTOS.indexOf(f.estado) >= 0;
      if (k === 'urgentes') return f.urgente && ABIERTOS.indexOf(f.estado) >= 0;
      if (k === 'errores') return f.tipo === 'error';
      if (k === 'ideas') return f.tipo === 'idea';
      return true;
    });
  }
  function ordenados() {
    var fs = cuenta(E.filtro).slice();
    // los urgentes sin resolver arriba; después, lo más nuevo
    return fs.sort(function (a, b) {
      var ua = a.urgente && ABIERTOS.indexOf(a.estado) >= 0 ? 1 : 0, ub = b.urgente && ABIERTOS.indexOf(b.estado) >= 0 ? 1 : 0;
      return ub - ua || (a.creado < b.creado ? 1 : -1);
    });
  }
  function pintar() {
    $('#px').setAttribute('aria-busy', 'false');
    var fl = $('#cn-filtros');
    fl.hidden = false;
    fl.innerHTML = FILTROS.map(function (x) {
      var n = cuenta(x[0]).length;
      return '<button type="button" class="cn-f' + (x[0] === 'urgentes' && n ? ' rojo' : '') + '" data-filtro="' + x[0] + '" aria-pressed="' + (E.filtro === x[0]) + '">' + x[1] + ' <b>' + n + '</b></button>';
    }).join('');
    $$('[data-filtro]', fl).forEach(function (b) { b.onclick = function () { E.filtro = b.dataset.filtro; pintar(); }; });

    var fs = ordenados();
    if (!(E.filas || []).length) {
      $('#vista').innerHTML = '<div class="tarjeta vacio"><h3>Todavía no hay reportes</h3><p class="sub">Cuando alguien toque «Reportar o sugerir» (en la barra de la izquierda o en el menú de su foto), aparece aquí.</p></div>';
      avisarBarra(); return;
    }
    if (!E.abierto || !fs.some(function (f) { return f.id === E.abierto; })) E.abierto = window.innerWidth > 900 && fs[0] ? fs[0].id : null;
    if (E.abierto) marcarVisto(E.abierto);
    var antes = $('.cn-lista'), bajado = antes ? antes.scrollTop : 0;   // la lista no vuelve arriba al abrir otro
    $('#vista').innerHTML = '<div class="cn-cuerpo' + (E.abierto && E.movil ? ' abierto' : '') + '" id="cn-cuerpo">' +
      '<section class="tarjeta cn-panel cn-lista" aria-label="Reportes">' + (fs.length ? fs.map(fila).join('') : '<p class="cn-vacio">Nada por aquí. ' + (E.filtro === 'atender' ? 'Todo está atendido.' : '') + '</p>') + '</section>' +
      '<section class="tarjeta cn-panel cn-det" id="cn-det" aria-label="El reporte abierto">' + detalle() + '</section></div>';
    $$('[data-abrir]').forEach(function (b) { b.onclick = function () { abrir(Number(b.dataset.abrir)); E.movil = true; pintar(); }; });
    var l = $('.cn-lista'); if (l && bajado) l.scrollTop = bajado;
    conectarDetalle();
    medir();
    avisarBarra();
  }
  function fila(f) {
    return '<button type="button" class="cn-it' + (f.id === E.abierto ? ' on' : '') + (f.visto_admin ? '' : ' nuevo') + '" data-abrir="' + f.id + '">' +
      '<span class="cn-it-arr"><span class="cn-tipo ' + (f.tipo === 'idea' ? 'idea' : 'error') + '">' + (f.tipo === 'idea' ? 'Idea' : 'Error') + '</span>' +
        (f.urgente && ABIERTOS.indexOf(f.estado) >= 0 ? '<span class="cn-urg">No puede seguir</span>' : '') + '<span class="hace">' + hace(f.creado) + '</span></span>' +
      '<b>' + esc(f.texto) + '</b>' +
      '<span class="cn-it-meta">' + esc([f.marca, f.area].filter(Boolean).join(' · ')) + ' <span class="est e-' + esc(f.estado) + '">' + esc(nombreEstado(f)) + '</span>' +
        (tarde(f) ? '<span class="cn-tarde">pasaron las 24 h</span>' : '') + '</span></button>';
  }
  function detalle() {
    var f = (E.filas || []).filter(function (x) { return x.id === E.abierto; })[0];
    if (!f) return '<p class="cn-vacio">Escoge un reporte de la lista.</p>';
    var t = f.tecnico || {}, errs = Array.isArray(t.errores) ? t.errores : [];
    var b = E.borrador[f.id] || { estado: f.estado, texto: '' };
    var foto = E.fotos[f.id];
    var tec = errs.map(function (x) { return (x.t || '').slice(11, 19) + '  ' + (x.m || '') + (x.d ? '  [' + x.d + ']' : '') + (x.p ? '  ' + x.p : ''); }).join('\n');
    return '<button type="button" class="b-linea cn-volver" data-volver>‹ Volver a la lista</button>' +
      '<div class="cn-d"><div class="cn-d-izq">' +
        '<div class="cn-d-arr"><span class="cn-tipo ' + (f.tipo === 'idea' ? 'idea' : 'error') + '">' + (f.tipo === 'idea' ? 'Idea' : 'Error') + '</span>' +
          (f.tipo === 'error' ? (f.urgente ? '<span class="cn-urg">No puede seguir</span>' : '<span>Puede seguir</span>') : '') +
          '<span class="num">N.º ' + f.id + '</span><span>' + hace(f.creado) + '</span>' + (tarde(f) ? '<span class="cn-tarde">pasaron las 24 h sin respuesta</span>' : '') + '</div>' +
        '<p class="cn-d-txt copiable">' + esc(f.texto) + '</p>' +
        (f.para_que ? '<p class="cn-d-para copiable"><span>Para qué le serviría</span>' + esc(f.para_que) + '</p>' : '') +
        '<div class="cn-datos">' +
          '<div class="ancho"><span class="cn-et">Quién</span><b class="copiable">' + esc(quien(f)) + '</b></div>' +
          '<div><span class="cn-et">Marca</span><b>' + esc(f.marca || '—') + '</b></div>' +
          '<div><span class="cn-et">Dónde estaba</span><b>' + esc((f.pantalla || '—').split(' · ')[0]) + '</b></div>' +
          '<div><span class="cn-et">Cuándo</span><b>' + esc(fecha(f.creado)) + '</b></div>' +
          '<div><span class="cn-et">Equipo</span><b>' + esc(equipo(t)) + '</b></div>' +
          '<div><span class="cn-et">Parte de Cherry</span><b>' + esc(f.area || '—') + '</b></div>' +
        '</div>' +
        (f.foto ? '<a class="cn-foto" ' + (foto ? 'href="' + esc(foto) + '" target="_blank" rel="noopener"' : '') + ' aria-label="Abrir la foto en grande">' +
          (foto ? '<img alt="La pantalla de la persona al reportar" src="' + esc(foto) + '">' : '<span>Trayendo la foto…</span>') + '</a>'
          : '<div class="cn-foto"><span>Sin foto de la pantalla.</span></div>') +
        (f.adjunto ? '<a class="b-linea" data-adjunto="' + esc(f.adjunto) + '" href="#">Ver lo que adjuntó</a>' : '') +
        '<details class="cn-tec"><summary>Detalle técnico' + (errs.length ? ' · ' + errs.length + (errs.length === 1 ? ' falla registrada' : ' fallas registradas') : ' · sin fallas registradas') + '</summary>' +
          '<pre class="copiable">' + esc((tec ? tec + '\n\n' : '') + (f.pantalla || '') + '\n' + (t.url || '') + '\n' + (t.navegador || '') + '\n' + (t.hora || '')) + '</pre></details>' +
      '</div><div class="cn-d-der">' +
        '<div><span class="cn-et">Estado</span><div class="cn-estados">' + (ESTADOS[f.tipo] || ESTADOS.error).map(function (e) {
          return '<button type="button" data-estado="' + e[0] + '" aria-pressed="' + (b.estado === e[0]) + '">' + e[1] + '</button>'; }).join('') + '</div></div>' +
        (f.respuesta ? '<div><span class="cn-et">Ya le respondiste · ' + esc(f.respondido ? hace(f.respondido) : '') + '</span><p class="cn-ya">' + esc(f.respuesta) + '</p></div>' : '') +
        '<div><span class="cn-et">' + (f.respuesta ? 'Otra respuesta' : 'Tu respuesta') + ' · la ve en «Mis reportes»</span><div class="cn-rapidas">' + (RAPIDAS[f.tipo] || RAPIDAS.error).map(function (r, i) {
          return '<button type="button" data-rapida="' + i + '">' + esc(r[1]) + '</button>'; }).join('') + '</div></div>' +
        '<textarea id="cn-resp" maxlength="2000" placeholder="O escribe la tuya…">' + esc(b.texto) + '</textarea>' +
        '<div class="nav"><button type="button" class="b-principal" data-guardar>Guardar y responder</button>' +
          '<button type="button" class="b-chico" data-copiar>Copiar todo</button></div>' +
      '</div></div>';
  }
  function conectarDetalle() {
    var f = (E.filas || []).filter(function (x) { return x.id === E.abierto; })[0];
    if (!f) return;
    var b = E.borrador[f.id] = E.borrador[f.id] || { estado: f.estado, texto: '' };
    var v = $('[data-volver]'); if (v) v.onclick = function () { E.movil = false; var c = $('#cn-cuerpo'); if (c) c.classList.remove('abierto'); };
    $$('[data-estado]').forEach(function (x) { x.onclick = function () { b.estado = x.dataset.estado; $$('[data-estado]').forEach(function (y) { y.setAttribute('aria-pressed', String(y === x)); }); }; });
    $$('[data-rapida]').forEach(function (x) {
      x.onclick = function () {
        var r = (RAPIDAS[f.tipo] || RAPIDAS.error)[Number(x.dataset.rapida)];
        b.texto = r[1]; b.estado = r[0]; $('#cn-resp').value = r[1];
        $$('[data-estado]').forEach(function (y) { y.setAttribute('aria-pressed', String(y.dataset.estado === r[0])); });
      };
    });
    $('#cn-resp').oninput = function () { b.texto = this.value; };
    $('[data-guardar]').onclick = function () { guardar(f, this); };
    $('[data-copiar]').onclick = function () { copiar(f); };
    var ad = $('[data-adjunto]'); if (ad) ad.onclick = function (e) { e.preventDefault(); firmar(ad.dataset.adjunto).then(function (u) { if (u) window.open(u, '_blank', 'noopener'); }); };
    if (f.foto && !E.fotos[f.id]) firmar(f.foto).then(function (u) { if (!u || E.abierto !== f.id) return; E.fotos[f.id] = u; refrescarDetalle(); });
  }
  function refrescarDetalle() { var d = $('#cn-det'); if (!d) return; d.innerHTML = detalle(); conectarDetalle(); }
  // las fotos están en un cubo privado: una dirección firmada que dura una hora
  function firmar(ruta) {
    return App.rest('/storage/v1/object/sign/reportes/' + ruta.split('/').map(encodeURIComponent).join('/'), { method: 'POST', body: JSON.stringify({ expiresIn: 3600 }) })
      .then(function (r) { return r && (r.signedURL || r.signedUrl) ? SUPA + '/storage/v1' + (r.signedURL || r.signedUrl) : null; })
      .catch(function () { return null; });
  }
  function abrir(id) { E.abierto = id; }
  function marcarVisto(id) {
    var f = (E.filas || []).filter(function (x) { return x.id === id; })[0];
    if (!f || f.visto_admin) return;
    f.visto_admin = new Date().toISOString();
    App.rest('/rest/v1/rpc/responder_reporte', { method: 'POST', body: JSON.stringify({ p_id: id, p_solo_visto: true }) }).catch(function () { f.visto_admin = null; });
  }
  function guardar(f, boton) {
    var b = E.borrador[f.id] || {}, texto = String(b.texto || '').trim();
    if (b.estado === f.estado && !texto) { aviso('Escoge otro estado o escribe una respuesta.'); return; }
    boton.disabled = true; boton.textContent = 'Guardando…';
    App.rest('/rest/v1/rpc/responder_reporte', { method: 'POST', body: JSON.stringify({ p_id: f.id, p_estado: b.estado || null, p_respuesta: texto || null }) }).then(function (r) {
      var n = Array.isArray(r) ? r[0] : r;
      E.filas = E.filas.map(function (x) { return x.id === f.id ? (n && n.id ? n : x) : x; });
      delete E.borrador[f.id];
      pintar();
      aviso(texto ? 'Respondido. Lo ve en «Mis reportes» con un punto amarillo.' : 'Guardado: ' + nombreEstado(n || f) + '.');
    }).catch(function (e) { boton.disabled = false; boton.textContent = 'Guardar y responder'; aviso('No se pudo guardar: ' + e.message); });
  }
  function copiar(f) {
    var t = f.tecnico || {};
    var txt = (f.tipo === 'idea' ? 'Idea' : 'Reporte') + ' n.º ' + f.id + ' (' + fecha(f.creado) + ')\n' + f.texto + (f.para_que ? '\nPara qué: ' + f.para_que : '') +
      '\nQuién: ' + quien(f) + ' · marca: ' + (f.marca || '—') + ' · ' + (f.pantalla || '') + (f.urgente ? ' · NO PUEDE SEGUIR' : '') +
      '\nEquipo: ' + equipo(t) + '\nFallas: ' + JSON.stringify(t.errores || []);
    var ok = function () { aviso('Copiado. Pégamelo en el chat y lo reviso.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, function () { aviso('No se pudo copiar.'); });
  }
  // los dos paneles caben en la pantalla (cada uno con su propio scroll); en el celular, uno debajo del otro
  function medir() {
    var c = $('#cn-cuerpo'); if (!c) return;
    var arriba = c.getBoundingClientRect().top + window.scrollY;
    c.style.setProperty('--alto', Math.max(380, window.innerHeight - arriba - 24) + 'px');
  }
  window.addEventListener('resize', medir);
  // el número rojo de la Consola en la barra: los que todavía no has mirado
  function avisarBarra() {
    if (!window.CherryLado || !CherryLado.punto) return;
    CherryLado.punto('consola', (E.filas || []).filter(function (f) { return !f.visto_admin; }).length);
  }

  if (!App) return;
  App.barra();
  cargar();
})();
</script>
</body>
</html>

<!doctype html>
<meta charset="utf-8">
<title>Prueba firmas viñetas (NUNCA se publica)</title>
<script>
  window.__pedidas = 0;
  window.CherryApp = {
    usuario: function () { return { id: 'u-prueba' }; },
    base: function () { return 'https://ejemplo.supabase.co'; },
    rest: function (ruta, o) {
      window.__pedidas++;
      var paths = JSON.parse(o.body).paths;
      return Promise.resolve(paths.map(function (p) { return { path: p, signedURL: '/object/sign/vinetas/' + p + '?token=t' + Date.now() }; }));
    }
  };
</script>
<script src="../js/vinetas.js?v=prueba"></script>

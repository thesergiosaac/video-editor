<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carrete — Editor con IA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Diseño: Outfit, Space Grotesk, DM Mono, Caveat · Subtítulos: Roboto y Montserrat -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Caveat:wght@600;700&family=Roboto:wght@400;700&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Fondo: el ÚNICO lugar con degradados -->
    <div class="bg-blob bg-blob--magenta"></div>
    <div class="bg-blob bg-blob--violet"></div>
    <div class="bg-blob bg-blob--amber"></div>
    <div class="grain"></div>

    <div id="app"></div>

    <!-- 1. Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- 2. Core CARRETE -->
    <script src="js/dom.js"></script>
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>

    <!-- 3. Capa de API (sesión con correo y contraseña) — antes de los componentes -->
    <script src="js/api.js"></script>

    <!-- 4. Componentes UI -->
    <script src="js/components/login.js"></script>
    <script src="js/components/topbar.js"></script>
    <script src="js/components/phone.js"></script>
    <script src="js/components/config.js"></script>
    <script src="js/components/media.js"></script>
    <script src="js/components/overlays.js"></script>
    <script src="js/components/result.js"></script>

    <!-- 5. Main — arranca la app -->
    <script src="js/main.js"></script>
  </body>
</html>
